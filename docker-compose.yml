# =============================================================================
# Local Development Compose
# =============================================================================
# Use this for running the entire local stack (DB, Cache, Backend, Frontend)
# 
# Commands:
#   docker compose up -d postgres redis              # DB + Cache only
#   docker compose up -d                             # Full stack (API + DB + Cache)
#   docker compose --profile admin up -d             # Include DB admin tools
#   docker compose --profile dev up -d               # Include frontend dev server
#
# DB Admin Tools (run with --profile admin):
#   pgAdmin:    http://localhost:5050  (admin@quax.com / admin)
#   Adminer:    http://localhost:8081  (Lightweight alternative)
#
# =============================================================================

name: quax

services:
  # ===========================================================================
  # Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: quax-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-quax_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quax} -d ${POSTGRES_DB:-quax_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quax_net
    profiles:
      - infra
      - full

  # ===========================================================================
  # Cache (Optional - graceful degradation)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: quax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quax_net
    profiles:
      - infra
      - full

  # ===========================================================================
  # Internal Event Bus (NATS JetStream)
  # ===========================================================================
  nats:
    image: nats:2-alpine
    container_name: quax-nats
    command:
      - "-js"
      - "-m"
      - "8222"
      - "--store_dir"
      - "/data/jetstream"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    networks:
      - quax_net
    profiles:
      - infra
      - full

  # ===========================================================================
  # MQTT Broker for Attendance Devices (EMQX)
  # ===========================================================================
  emqx:
    image: docker.1ms.run/emqx/emqx:5.8.6
    container_name: quax-emqx
    environment:
      EMQX_NODE_NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - quax_net
    profiles:
      - infra
      - full

  # ===========================================================================
  # Backend API
  # ===========================================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: quax-api
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://quax:secret@postgres:5432/quax_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://emqx:1883}
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
      nats:
        condition: service_started
        required: false
      emqx:
        condition: service_healthy
        required: false
    networks:
      - quax_net

  # ===========================================================================
  # Frontend (Production Build)
  # ===========================================================================
  # Uncomment to serve frontend via nginx in Docker
  # ui:
  #   build:
  #     context: ./ui
  #     dockerfile: Dockerfile
  #   container_name: quax-ui
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - quax_net

  # ===========================================================================
  # Database Admin (pgAdmin)
  # ===========================================================================
  # Web-based PostgreSQL admin tool (like phpMyAdmin)
  # Access: http://localhost:5050
  # Default login: admin@quax.local / admin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quax-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@quax.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quax_net
    restart: unless-stopped
    profiles:
      - admin  # Run with: docker compose --profile admin up -d

  # ===========================================================================
  # Database Admin (Adminer - Alternative)
  # ===========================================================================
  # Lightweight alternative to pgAdmin
  # Access: http://localhost:8081
  # System: PostgreSQL
  # Server: postgres
  # Username: quax
  # Password: secret
  # Database: quax_db
  adminer:
    image: adminer:latest
    container_name: quax-adminer
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quax_net
    restart: unless-stopped
    profiles:
      - infra
      - admin
      - full

  # ===========================================================================
  # Reverse Proxy (Caddy)
  # ===========================================================================
  # Uncomment for production with HTTPS
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: quax-caddy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./api/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - quax_net
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
  emqx_data:
  emqx_log:
  pgadmin_data:
  caddy_data:
  caddy_config:

networks:
  quax_net:
    name: quax_net
