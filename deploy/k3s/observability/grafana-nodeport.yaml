apiVersion: v1
kind: Service
metadata:
  name: shanhuai-grafana-nodeport
  namespace: shanhuai-observability
  labels:
    app.kubernetes.io/name: shanhuai-grafana
    app.kubernetes.io/part-of: shanhuai-observability
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: shanhuai-vm
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
      nodePort: 30082
