apiVersion: v1
kind: Namespace
metadata:
  name: shanhuai-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shanhuai-app-config
  namespace: shanhuai-app
data:
  RUST_ENV: production
  RUST_LOG: info
  SERVER_PORT: "8080"
  CORS_ALLOWED_ORIGINS: "http://36.151.143.235:30081,http://shanhuai.top,https://shanhuai.top,http://admin.shanhuai.top,https://admin.shanhuai.top"
  DB_MAX_CONNECTIONS: "5"
  DB_MIN_CONNECTIONS: "1"
  NATS_URL: nats://nats.shanhuai-infra.svc.cluster.local:4222
  MQTT_BROKER_URL: mqtt://emqx.shanhuai-infra.svc.cluster.local:1883
  BOOTSTRAP_ENABLED: "true"
  COOKIE_SAMESITE: lax
  COOKIE_SECURE: "false"
  COOKIE_HTTPONLY: "true"
  STORAGE_DRIVER: jdcloud_oss
  UPLOAD_DIR: /app/uploads
  MAX_AVATAR_SIZE: "2097152"
  MAX_UPLOAD_SIZE: "52428800"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shanhuai-api
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-api
    app.kubernetes.io/part-of: shanhuai-gc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shanhuai-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shanhuai-api
        app.kubernetes.io/part-of: shanhuai-gc
    spec:
      containers:
        - name: api
          image: shanhuai-api:initial
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shanhuai-app-config
            - secretRef:
                name: shanhuai-app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shanhuai-api
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-api
    app.kubernetes.io/part-of: shanhuai-gc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shanhuai-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shanhuai-report-worker
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-report-worker
    app.kubernetes.io/part-of: shanhuai-gc
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shanhuai-report-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shanhuai-report-worker
        app.kubernetes.io/part-of: shanhuai-gc
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: shanhuai-report-worker:initial
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shanhuai-app-config
            - secretRef:
                name: shanhuai-app-secret
          env:
            - name: REPORT_FORWARD_POLL_SECONDS
              value: "5"
            - name: REPORT_FORWARD_HEARTBEAT_SECONDS
              value: "30"
            - name: REPORT_FORWARD_WORKER_TARGET
              value: k3s
            - name: REPORT_FORWARD_PRODUCTION_COOLDOWN_SECONDS
              value: "600"
            - name: CHROMIUM_BINARY
              value: /usr/bin/chromium
            - name: CHROMEDRIVER_BINARY
              value: /usr/bin/chromedriver
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1200m
              memory: 1280Mi
          volumeMounts:
            - name: worker-data
              mountPath: /data
            - name: chromium-shm
              mountPath: /dev/shm
      volumes:
        - name: worker-data
          emptyDir: {}
        - name: chromium-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shanhuai-ui
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-ui
    app.kubernetes.io/part-of: shanhuai-gc
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: shanhuai-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shanhuai-ui
        app.kubernetes.io/part-of: shanhuai-gc
    spec:
      containers:
        - name: ui
          image: shanhuai-ui:initial
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shanhuai-ui
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-ui
    app.kubernetes.io/part-of: shanhuai-gc
  annotations:
    traefik.ingress.kubernetes.io/service.serverstransport: shanhuai-app-shanhuai-ui-long-requests@kubernetescrd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: shanhuai-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: shanhuai-ui-long-requests
  namespace: shanhuai-app
spec:
  forwardingTimeouts:
    dialTimeout: 10s
    responseHeaderTimeout: 600s
    idleConnTimeout: 600s
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shanhuai-admin
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-admin
    app.kubernetes.io/part-of: shanhuai-gc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shanhuai.top
      secretName: shanhuai-top-tls
  rules:
    - host: shanhuai.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shanhuai-ui
                port:
                  name: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: admin@shanhuai.top
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: shanhuai-redirect-https
  namespace: shanhuai-app
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shanhuai-admin-http
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-admin-http
    app.kubernetes.io/part-of: shanhuai-gc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: shanhuai-app-shanhuai-redirect-https@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: shanhuai.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shanhuai-ui
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shanhuai-admin-legacy
  namespace: shanhuai-app
  labels:
    app.kubernetes.io/name: shanhuai-admin-legacy
    app.kubernetes.io/part-of: shanhuai-gc
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: admin.shanhuai.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shanhuai-ui
                port:
                  name: http
